<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SaiRaDo | Chat & Calls</title>

<script src="/socket.io/socket.io.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .auth-box {
      background: white; padding: 40px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px;
    }
    .auth-box h2 { text-align: center; margin-bottom: 20px; color: #333; }
    .auth-input {
      width: 100%; padding: 12px; margin-bottom: 15px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 16px;
    }
    .auth-btn {
      width: 100%; padding: 12px; background: #667eea; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-bottom: 10px;
    }
    .auth-link { text-align: center; color: #667eea; cursor: pointer; font-size: 14px; }

    .app-container {
      display: flex; height: 100vh; max-width: 1400px; margin: 0 auto; width: 100%;
      background: white; box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
      background: #f8f9fa;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .sidebar-header-left { display: flex; flex-direction: column; gap: 2px; }
    .sidebar-header-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

    .btn-logout-sidebar {
      background: #f44336;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Enable buttons (Mic/Cam pre-enable) */
    .enable-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #e9ecef;
      color: #333;
      transition: 0.15s;
      white-space: nowrap;
      width: 120px;
    }
    .enable-btn.on { background: #4caf50; color: #fff; }
    .enable-btn.off { background: #e9ecef; color: #555; }
    .enable-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Sidebar tabs */
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
    }
    .sidebar-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .sidebar-tab.active {
      color: #2196f3;
      border-bottom-color: #2196f3;
    }
    .sidebar-tab { position: relative; }
    .tab-badge {
      position: absolute;
      top: 6px; right: 10px;
      width: 8px; height: 8px;
      background: #f44336;
      border-radius: 50%;
      display: inline-block;
    }

    .tab-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .tab-panel.active { display: flex; }

    /* New Group button */
    .new-group-btn {
      margin: 10px 12px;
      padding: 9px 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .new-group-btn:hover { background: #5568d4; }

    .user-list { overflow-y: auto; flex: 1; }

    .user-item {
      padding: 14px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.2s;
    }
    .user-item:hover { background: #f5f7fa; }
    .user-item.active { background: #e3f2fd; border-left: 4px solid #2196f3; }
    .user-item.blocked-item { opacity: 0.55; }

    .user-info-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .user-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-name-sub { font-size: 11px; color: #999; margin-top: 1px; }

    .user-status {
      width: 10px; height: 10px;
      background: #ff9800; /* offline */
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .user-status.online { background: #4caf50; }
    .group-icon {
      width: 28px; height: 28px;
      background: #667eea;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex: 0 0 auto;
      color: white;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .unread-badge {
      background: #f44336;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .delete-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.7;
    }
    .delete-btn:hover { opacity: 1; }

    .block-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      opacity: 0.7;
      padding: 2px;
    }
    .block-btn:hover { opacity: 1; }
    .block-btn.blocked { color: #f44336; opacity: 1; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; position: relative; }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      gap: 10px;
    }

    .chat-title-wrap { display: flex; align-items: center; gap: 10px; }
    .chat-status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ff9800; /* offline */
      flex: 0 0 auto;
    }
    .chat-status-dot.online { background: #4caf50; }
    .chat-group-icon {
      width: 28px; height: 28px;
      background: #667eea;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: white;
      flex: 0 0 auto;
    }

    .chat-substatus {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    .chat-title-text { display: flex; flex-direction: column; }

    .chat-actions { display: flex; align-items: center; }
    .chat-actions button {
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      margin-left: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
      color: white;
      font-size: 13px;
    }
    .chat-actions button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-back { background: #e0e0e0; color: #333 !important; margin-right: 8px; }
    .btn-audio { background: #4caf50; }
    .btn-video { background: #2196f3; }

    .messages-box {
      flex: 1; padding: 20px; overflow-y: auto; background: #fafafa;
      display: flex; flex-direction: column; gap: 10px;
    }
    .message { max-width: 70%; padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; position: relative; }
    .msg-sent { align-self: flex-end; background: #2196f3; color: white; border-bottom-right-radius: 4px; }
    .msg-received { align-self: flex-start; background: white; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    .msg-meta { font-size: 10px; text-align: right; margin-top: 4px; opacity: 0.8; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
    .msg-sender-name { font-size: 11px; font-weight: 700; color: #667eea; margin-bottom: 3px; }
    .message-image { display: block; max-width: min(240px, 60vw); max-height: 240px; object-fit: contain; border-radius: 10px; margin: 4px 0; }
    .message-image { cursor: zoom-in; }
    .message-video { display: block; max-width: min(300px, 65vw); max-height: 220px; border-radius: 10px; margin: 4px 0; background: #111; }
    .video-expand { padding: 5px 10px; border: 0; border-radius: 14px; cursor: pointer; font-size: 12px; }
    .image-viewer {
      position: fixed; inset: 0; z-index: 300; display: flex;
      align-items: center; justify-content: center; padding: 48px 16px 16px;
      background: rgba(0, 0, 0, 0.92);
    }
    .image-viewer img, .image-viewer video { max-width: 100%; max-height: 100%; object-fit: contain; }
    .image-viewer-close {
      position: absolute; top: 12px; right: 16px; width: 44px; height: 44px;
      border: 0; border-radius: 50%; background: rgba(255,255,255,0.16);
      color: white; font-size: 30px; cursor: pointer;
    }

    .input-area {
      padding: 20px; border-top: 1px solid #e0e0e0; background: white;
      display: flex; gap: 10px;
    }
    .input-area input {
      flex: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 25px; outline: none;
    }
    .input-area button {
      padding: 10px 25px; background: #2196f3; color: white; border: none; border-radius: 25px; cursor: pointer;
    }
    .input-area button:disabled { opacity: 0.55; cursor: wait; }
    .attach-btn { flex: 0 0 auto; padding: 10px 14px !important; }
    .attachment-status { align-self: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #666; }
    .attachment-remove { padding: 4px 8px !important; background: #e0e0e0 !important; color: #333 !important; }

    /* Call Overlay */
    .call-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white;
      padding: 16px;
    }

    .call-banner {
      max-width: 680px;
      width: 100%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #fff;
      display: none;
    }
    .call-banner.show { display: block; }

    .video-wrapper {
      position: relative; width: 100%; max-width: 600px; height: 50vh;
      margin-bottom: 20px; display: flex; justify-content: center;
    }
    video { border-radius: 10px; background: #222; width: 100%; height: 100%; object-fit: cover; }
    #local-video {
      width: 100px; height: 150px; position: absolute; bottom: 10px; right: 10px;
      border: 2px solid white; z-index: 60; background: #333;
    }

    .call-controls {
      display: flex; gap: 15px; margin-top: 10px; z-index: 60;
      flex-wrap: wrap; justify-content: center;
    }

    .control-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      position: relative;
      user-select: none;
    }

    .btn-end { background: #f44336; color: white; width: 64px; height: 64px; font-size: 22px; }
    .btn-answer { background: #4caf50; color: white; width: 64px; height: 64px; animation: pulse 1.5s infinite; font-size: 22px; }

    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 20px;
    }
    .btn-secondary.active {
      background: #fff;
      color: #111;
    }
    .btn-secondary .strike {
      display: none;
      position: absolute;
      width: 72%;
      height: 3px;
      background: #f44336;
      border-radius: 2px;
      transform: rotate(-45deg);
      top: 50%;
      left: 14%;
    }
    .btn-secondary.active .strike { display: block; }
    .btn-secondary .icon { line-height: 1; }

    .btn-secondary.loudspeaker-mode {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .btn-secondary.headset-mode {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    /* Modal overlay for create group */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45); z-index: 200;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: white; border-radius: 12px; padding: 28px;
      width: 90%; max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-box h3 { margin-bottom: 16px; color: #333; }
    .modal-input {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none;
    }
    .modal-input:focus { border-color: #667eea; }
    .modal-members-list { max-height: 200px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 14px; }
    .modal-member-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
      transition: background 0.15s;
    }
    .modal-member-item:last-child { border-bottom: none; }
    .modal-member-item:hover { background: #f5f7fa; }
    .modal-member-item input[type=checkbox] { accent-color: #667eea; width: 16px; height: 16px; cursor: pointer; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .modal-btn {
      padding: 9px 20px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 14px;
    }
    .modal-btn-cancel { background: #e0e0e0; color: #333; }
    .modal-btn-create { background: #667eea; color: white; }
    .modal-btn-create:hover { background: #5568d4; }

    .hidden { display: none !important; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid #ddd; }
      .chat-area { height: 60vh; }
      .sidebar.mobile-hidden { display: none; }
      .chat-area.mobile-fullscreen { height: 100vh; }
      .input-area { padding: 10px; gap: 6px; flex-wrap: wrap; }
      .input-area input { min-width: 0; padding: 10px 12px; }
      .input-area button { padding: 10px 14px; }
      .attachment-status { flex-basis: 100%; order: 2; }
    }

    .password-wrapper { position: relative; }
    .password-wrapper .auth-input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #667eea;
      font-size: 18px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .pw-toggle:focus { outline: 2px solid rgba(102,126,234,0.25); }
  </style>
</head>

<body>
  <div id="auth-screen" class="auth-container hidden">
    <div class="auth-box">
      <h2 id="auth-title">SaiRaDo Login</h2>
      <input id="username" class="auth-input" placeholder="Username" />
      <div class="password-wrapper" style="width:100%; max-width:100%;">
        <input id="password" type="password" class="auth-input" placeholder="Password" />
        <button id="pw-toggle" class="pw-toggle" type="button"
                aria-pressed="false" title="Show password"
                onclick="togglePassword('password','pw-toggle')">👁️</button>
      </div>
      <button id="auth-submit-btn" class="auth-btn" onclick="handleAuth()">Sign In</button>
      <div class="auth-link" onclick="toggleAuthMode()">
        Switch to <span id="auth-switch-text">Sign Up</span>
      </div>
      <p id="auth-error" style="color:red; text-align:center; margin-top:10px;" class="hidden"></p>
    </div>
  </div>

  <div id="app-screen" class="app-container hidden">
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-left">
          <h3>SaiRaDo</h3>
          <span id="current-username" style="font-size:12px; color:#666;"></span>
        </div>

        <div class="sidebar-header-right">
          <button id="enable-mic-btn" class="enable-btn off" onclick="togglePrefMic()">Enable 🎤</button>
          <button id="enable-cam-btn" class="enable-btn off" onclick="togglePrefCam()">Enable 📷</button>
          <button class="btn-logout-sidebar" onclick="logout()">🚫 Logout</button>
        </div>
      </div>

      <!-- Tabs: Chats / Groups -->
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tab-chats" onclick="switchTab('chats')">💬 Chats</button>
        <button class="sidebar-tab" id="tab-groups" onclick="switchTab('groups')">👥 Groups</button>
      </div>

      <!-- Chats panel -->
      <div id="panel-chats" class="tab-panel active">
        <div id="users-list" class="user-list"></div>
      </div>

      <!-- Groups panel -->
      <div id="panel-groups" class="tab-panel">
        <button class="new-group-btn" onclick="openCreateGroupModal()">＋ New Group</button>
        <div id="groups-list" class="user-list"></div>
      </div>
    </div>

    <div id="chat-area" class="chat-area">
      <div id="no-chat-selected" style="flex:1; display:flex; align-items:center; justify-content:center; color:#999;">
        Select a user or group to start chatting
      </div>

      <div id="active-chat-interface" class="hidden" style="display:flex; flex-direction:column; height:100%;">
        <div class="chat-header">
          <div style="display:flex; align-items:center;">
            <button class="btn-back" onclick="closeChat()">⬅</button>

            <div class="chat-title-wrap">
              <div id="chat-status-dot" class="chat-status-dot"></div>
              <div id="chat-group-icon" class="chat-group-icon hidden">👥</div>
              <div class="chat-title-text">
                <h3 id="chat-with-name" style="margin:0;">User</h3>
                <div id="chat-with-status" class="chat-substatus">Offline</div>
              </div>
            </div>
          </div>

          <div class="chat-actions">
            <button id="call-audio-btn" class="btn-audio" onclick="startCall('audio')" title="Audio Call">📞</button>
            <button id="call-video-btn" class="btn-video" onclick="startCall('video')" title="Video Call">📹</button>
          </div>
        </div>

        <div id="messages-container" class="messages-box"></div>

        <div class="input-area">
          <button id="attach-btn" class="attach-btn" type="button" onclick="document.getElementById('attachment-input').click()" title="Attach an image under 1 MB or video under 5 MB">📎</button>
          <input id="attachment-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm" hidden onchange="updateAttachmentLabel()" />
          <input id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()" />
          <span id="attachment-status" class="attachment-status"></span>
          <button id="attachment-remove" class="attachment-remove" type="button" onclick="clearSelectedAttachment()" title="Remove selected attachment" hidden>×</button>
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>

      <div id="call-modal" class="call-overlay hidden">
        <h2 id="call-status-text" style="margin-bottom:10px;">Calling...</h2>
        <div id="call-timer" style="font-size:18px; margin-bottom:10px; color:#4caf50;">00:00</div>

        <div id="call-banner" class="call-banner"></div>

        <div class="video-wrapper hidden" id="video-wrapper">
          <video id="remote-video" autoplay playsinline></video>
          <video id="local-video" autoplay muted playsinline></video>
        </div>

        <div class="call-controls">
          <div id="incoming-controls" class="hidden" style="display:flex; gap:20px;">
            <button class="control-btn btn-answer" onclick="answerCall()">📞</button>
            <button class="control-btn btn-end" onclick="rejectCall()">❌</button>
          </div>

          <div id="active-controls" class="hidden" style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center;">
            <button class="control-btn btn-secondary" id="mute-btn" onclick="toggleMute()" title="Mic">
              <span class="icon">🎤</span><span class="strike"></span>
            </button>

            <button class="control-btn btn-secondary" id="speaker-btn" onclick="toggleSpeaker()" title="Speaker">
              <span class="icon">🔊</span><span class="strike"></span>
            </button>

            <button class="control-btn btn-secondary" id="cam-off-btn" onclick="toggleVideo()" title="Camera">
              <span class="icon">📷</span><span class="strike"></span>
            </button>

            <button class="control-btn btn-secondary" id="switch-cam-btn" onclick="switchCamera()" title="Switch Camera">
              <span class="icon">🔄📷</span>
            </button>

            <button class="control-btn btn-end" onclick="endCall()" title="End Call">📞</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div id="create-group-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3>Create Group</h3>
      <input id="group-name-input" class="modal-input" placeholder="Group name" maxlength="60" />
      <p style="font-size:13px; color:#666; margin-bottom:8px;">Select members:</p>
      <div id="modal-members-list" class="modal-members-list"></div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeCreateGroupModal()">Cancel</button>
        <button class="modal-btn modal-btn-create" onclick="createGroup()">Create</button>
      </div>
    </div>
  </div>

  <div id="image-viewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="Enlarged chat attachment" onclick="closeImageViewer()">
    <button class="image-viewer-close" type="button" aria-label="Close enlarged attachment" onclick="closeImageViewer()">×</button>
    <img id="image-viewer-image" alt="Enlarged chat image" onclick="event.stopPropagation()" />
    <video id="image-viewer-video" controls playsinline hidden onclick="event.stopPropagation()"></video>
  </div>

  <audio id="remote-audio" autoplay></audio>
  <audio id="ringtone" loop src="/ringtone.mp3"></audio>

  <script>
    const socket = io({ autoConnect: false });

    const attachmentObjectUrls = new Set();
    let imageViewerTrigger = null;
    let currentUser = null;
    let selectedUser = null;       // direct chat target
    let selectedGroupId = null;    // group chat target
    let isSignup = false;

    let unreadCounts = {};
    let onlineUsersList = [];
    let contactsList = [];
    let groupsList = [];           // array of group objects
    let blockedList = [];          // array of blocked usernames
    let currentTab = 'chats';

    // Pre-enable state
    let prefMicOn = false;
    let prefCamOn = false;
    let micPermissionGranted = false;
    let camPermissionGranted = false;

    // WebRTC
    let localStream;
    let peerConnection;
    let incomingOffer;
    let currentCallType = null;
    let callTimerInterval;

    // During call toggles
    let isMuted = false;
    let isVideoStopped = false;
    let speakerMode = 'headset';

    let currentFacingMode = "user";
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !document.getElementById('image-viewer').classList.contains('hidden')) {
        closeImageViewer();
      }
    });

    window.addEventListener('load', async () => {
      const token = localStorage.getItem('token');
      if (token) {
        try {
          const res = await fetch('/api/auth/verify', { headers: { 'Authorization': `Bearer ${token}` } });
          if (res.ok) {
            const data = await res.json();
            currentUser = data.username;
            initializeSocket(token);
            showApp();
            await Promise.all([loadContacts(), loadGroups(), loadBlocked()]);
            renderUserList();
            renderGroupList();
            updateEnableButtons();
            updateChatHeaderStatus();
            updateCallButtonsAvailability();
            return;
          }
        } catch (e) {}
      }
      document.getElementById('auth-screen').classList.remove('hidden');
      updateEnableButtons();
    });

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleAuth();
    });

    function toggleAuthMode() {
      isSignup = !isSignup;
      document.getElementById('auth-title').innerText = isSignup ? 'SaiRaDo Sign Up' : 'SaiRaDo Login';
      document.getElementById('auth-switch-text').innerText = isSignup ? 'Login' : 'Sign Up';
      document.getElementById('auth-submit-btn').innerText = isSignup ? 'Sign Up' : 'Sign In';
    }

    async function handleAuth() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const endpoint = isSignup ? '/api/auth/signup' : '/api/auth/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          currentUser = data.username;
          initializeSocket(data.token);
          showApp();
          document.getElementById('auth-screen').classList.add('hidden');
          await Promise.all([loadContacts(), loadGroups(), loadBlocked()]);
          renderUserList();
          renderGroupList();
          updateEnableButtons();
          updateChatHeaderStatus();
          updateCallButtonsAvailability();
        } else {
          document.getElementById('auth-error').innerText = data.message;
          document.getElementById('auth-error').classList.remove('hidden');
        }
      } catch (e) {
        console.error(e);
      }
    }

    function showApp() {
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('current-username').innerText = currentUser;
    }

    function logout() {
      clearAttachmentObjectUrls();
      localStorage.clear();
      location.reload();
    }

    function isUserOnline(user) {
      return onlineUsersList.includes((user || '').toLowerCase());
    }

    function isUserBlocked(user) {
      return blockedList.includes((user || '').toLowerCase());
    }

    // --- Tab switching ---
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
      document.getElementById('tab-groups').classList.toggle('active', tab === 'groups');
      document.getElementById('panel-chats').classList.toggle('active', tab === 'chats');
      document.getElementById('panel-groups').classList.toggle('active', tab === 'groups');
      if (tab === 'groups') setGroupsTabBadge(false);
    }

    function setGroupsTabBadge(show) {
      const tab = document.getElementById('tab-groups');
      let badge = tab.querySelector('.tab-badge');
      if (show) {
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'tab-badge';
          tab.appendChild(badge);
        }
      } else {
        if (badge) badge.remove();
      }
    }

    function updateChatHeaderStatus() {
      const dot = document.getElementById('chat-status-dot');
      const txt = document.getElementById('chat-with-status');
      const groupIcon = document.getElementById('chat-group-icon');

      if (selectedGroupId) {
        dot.classList.add('hidden');
        groupIcon.classList.remove('hidden');
        const grp = groupsList.find(g => g.id === selectedGroupId);
        txt.textContent = grp ? `${grp.members.length} members` : 'Group';
        return;
      }

      groupIcon.classList.add('hidden');
      dot.classList.remove('hidden');

      if (!selectedUser) return;

      const online = isUserOnline(selectedUser);
      dot.classList.toggle('online', online);
      txt.textContent = online ? 'Online' : 'Offline';
    }

    function updateCallButtonsAvailability() {
      const audioBtn = document.getElementById('call-audio-btn');
      const videoBtn = document.getElementById('call-video-btn');
      // Calls only for direct 1-1 chats with online users
      const canCall = !!selectedUser && !selectedGroupId && isUserOnline(selectedUser);
      audioBtn.disabled = !canCall;
      videoBtn.disabled = !canCall;
    }

    async function loadContacts() {
      try {
        const res = await fetch('/api/contacts', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (res.ok) {
          const data = await res.json();
          const me = (currentUser || '').toLowerCase();
          contactsList = Array.isArray(data) ? data.map(u => u.toLowerCase()).filter(u => u !== me) : [];
        }
      } catch (e) {
        console.warn('Failed to load contacts', e);
      }
    }

    async function loadGroups() {
      try {
        const res = await fetch('/api/groups', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (res.ok) groupsList = await res.json();
      } catch (e) {
        console.warn('Failed to load groups', e);
      }
    }

    async function loadBlocked() {
      try {
        const res = await fetch('/api/blocked', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (res.ok) blockedList = await res.json();
      } catch (e) {
        console.warn('Failed to load blocked list', e);
      }
    }

    function initializeSocket(token) {
      socket.auth = { token };
      socket.connect();

      socket.on('users-online', (users) => {
        // Normalise everything to lowercase so comparisons are consistent
        const me = (currentUser || '').toLowerCase();
        onlineUsersList = users.map(u => u.toLowerCase()).filter(u => u !== me);
        renderUserList();
        updateCallButtonsAvailability();
        updateChatHeaderStatus();
      });

      socket.on('unread-counts', (counts) => {
        Object.assign(unreadCounts, counts);
        renderUserList();
      });

      socket.on('receive-message', (msg) => {
        const fromLower = (msg.from || '').toLowerCase();
        if (!contactsList.includes(fromLower)) contactsList.push(fromLower);

        if (selectedUser === fromLower && !selectedGroupId) {
          appendMessage(msg, 'received');
          socket.emit('mark-read', { sender: fromLower });
        } else {
          unreadCounts[fromLower] = (unreadCounts[fromLower] || 0) + 1;
          renderUserList();
        }
      });

      socket.on('message-sent-confirm', (msg) => {
        if (selectedUser === msg.to && !selectedGroupId) appendMessage(msg, 'sent');
        const toLower = (msg.to || '').toLowerCase();
        if (!contactsList.includes(toLower)) contactsList.push(toLower);
        renderUserList();
      });

      socket.on('messages-read', ({ by }) => {
        if (selectedUser === by) {
          document.querySelectorAll('.tick-mark').forEach(el => el.textContent = '✓✓');
        }
      });

      socket.on('message-blocked', ({ to }) => {
        // Silently ignored — sender sees their message wasn't delivered
      });

      // Group events
      socket.on('receive-group-message', (msg) => {
        if (selectedGroupId === msg.groupId) {
          appendGroupMessage(msg);
        } else {
          // bump unread badge for the group
          const grp = groupsList.find(g => g.id === msg.groupId);
          if (grp) {
            grp._unread = (grp._unread || 0) + 1;
            renderGroupList();
          }
        }
      });

      socket.on('group-created', (group) => {
        if (!groupsList.find(g => g.id === group.id)) {
          groupsList.push(group);
          renderGroupList();
          // If the creator is someone else, badge the Groups tab so the user notices
          if (group.createdBy !== (currentUser || '').toLowerCase()) {
            setGroupsTabBadge(true);
          }
        }
      });

      socket.on('group-deleted', ({ groupId }) => {
        groupsList = groupsList.filter(g => g.id !== groupId);
        if (selectedGroupId === groupId) closeChat();
        renderGroupList();
      });

      socket.on('call-failed', ({ user, reason }) => {
        if (reason === 'offline') alert(`${user} is offline. Calls are allowed only when the user is online.`);
        resetCallUI();
      });

      socket.on('incoming-call', ({ from, offer, type }) => {
        document.getElementById('ringtone').play().catch(() => {});
        incomingOffer = offer;
        selectedUser = from;
        selectedGroupId = null;
        currentCallType = type;

        updateCallButtonsAvailability();
        updateChatHeaderStatus();

        document.getElementById('call-modal').classList.remove('hidden');
        document.getElementById('call-status-text').innerText = `Incoming ${type} call from ${from}`;
        document.getElementById('incoming-controls').classList.remove('hidden');
        document.getElementById('active-controls').classList.add('hidden');

        showCallBannerIfNeeded();
      });

      socket.on('call-accepted', async (answer) => {
        document.getElementById('call-status-text').innerText = "Connected";
        try {
          const answerObj = typeof answer === 'string' ? JSON.parse(answer) : answer;
          await peerConnection.setRemoteDescription(new RTCSessionDescription(answerObj));
        } catch (err) {
          console.error('Error setting remote description for answer:', err);
        }
        startCallTimer();
        captureAndLogGPS('Start');
        showCallBannerIfNeeded();
      });

      socket.on('ice-candidate', (c) => {
        if (peerConnection && c) {
          try {
            peerConnection.addIceCandidate(new RTCIceCandidate(c));
          } catch (err) {
            console.error('Error adding ICE candidate:', err);
          }
        }
      });

      socket.on('call-cancelled', () => { resetCallUI(); alert('Call cancelled'); });
      socket.on('call-rejected', () => { resetCallUI(); alert('Call rejected'); });
      socket.on('call-ended', () => { captureAndLogGPS('End'); resetCallUI(); });
    }

    // --- Render user (direct chat) list ---
    function renderUserList() {
      const list = document.getElementById('users-list');
      list.innerHTML = '';

      const union = new Set([...(contactsList || []), ...(onlineUsersList || [])]);
      union.delete(currentUser);

      const allUsers = Array.from(union);

      allUsers.sort((a, b) => {
        const aOn = onlineUsersList.includes(a) ? 1 : 0;
        const bOn = onlineUsersList.includes(b) ? 1 : 0;
        if (aOn !== bOn) return bOn - aOn;
        return a.localeCompare(b);
      });

      allUsers.forEach(u => {
        const isOnline = onlineUsersList.includes(u);
        const blocked = isUserBlocked(u);

        const div = document.createElement('div');
        div.className = `user-item ${selectedUser === u && !selectedGroupId ? 'active' : ''} ${blocked ? 'blocked-item' : ''}`;

        const info = document.createElement('div');
        info.className = 'user-info-group';

        const dot = document.createElement('div');
        dot.className = `user-status ${isOnline ? 'online' : ''}`;

        const nameWrap = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'user-name';
        name.textContent = u;
        nameWrap.appendChild(name);
        if (blocked) {
          const sub = document.createElement('div');
          sub.className = 'user-name-sub';
          sub.textContent = 'Blocked';
          nameWrap.appendChild(sub);
        }

        info.appendChild(dot);
        info.appendChild(nameWrap);

        const actions = document.createElement('div');
        actions.className = 'user-actions';

        if (unreadCounts[u] && unreadCounts[u] > 0) {
          const badge = document.createElement('span');
          badge.className = 'unread-badge';
          badge.textContent = unreadCounts[u];
          actions.appendChild(badge);
        }

        // Block/unblock button
        const blockBtn = document.createElement('button');
        blockBtn.className = `block-btn ${blocked ? 'blocked' : ''}`;
        blockBtn.title = blocked ? 'Unblock user' : 'Block user';
        blockBtn.textContent = blocked ? '🚫' : '🚫';
        blockBtn.style.opacity = blocked ? '1' : '0.35';
        blockBtn.onclick = (e) => {
          e.stopPropagation();
          toggleBlockUser(u, blocked);
        };
        actions.appendChild(blockBtn);

        // Delete button
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.title = 'Delete chat history';
        del.textContent = '🗑';
        del.onclick = (e) => {
          e.stopPropagation();
          deleteChatHistory(u);
        };
        actions.appendChild(del);

        div.appendChild(info);
        div.appendChild(actions);

        div.onclick = () => { if (!blocked) selectUser(u); };
        list.appendChild(div);
      });
    }

    // --- Render group list ---
    function renderGroupList() {
      const list = document.getElementById('groups-list');
      list.innerHTML = '';

      groupsList.forEach(grp => {
        const div = document.createElement('div');
        div.className = `user-item ${selectedGroupId === grp.id ? 'active' : ''}`;

        const info = document.createElement('div');
        info.className = 'user-info-group';

        const icon = document.createElement('div');
        icon.className = 'group-icon';
        icon.textContent = '👥';

        const nameWrap = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'user-name';
        name.textContent = grp.name;
        const sub = document.createElement('div');
        sub.className = 'user-name-sub';
        sub.textContent = `${grp.members.length} members`;
        nameWrap.appendChild(name);
        nameWrap.appendChild(sub);

        info.appendChild(icon);
        info.appendChild(nameWrap);

        const actions = document.createElement('div');
        actions.className = 'user-actions';

        if (grp._unread && grp._unread > 0) {
          const badge = document.createElement('span');
          badge.className = 'unread-badge';
          badge.textContent = grp._unread;
          actions.appendChild(badge);
        }

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.title = 'Delete group';
        del.textContent = '🗑';
        del.onclick = (e) => {
          e.stopPropagation();
          deleteGroup(grp.id, grp.name);
        };
        actions.appendChild(del);

        div.appendChild(info);
        div.appendChild(actions);
        div.onclick = () => selectGroup(grp.id);
        list.appendChild(div);
      });
    }

    // --- Block / Unblock ---
    async function toggleBlockUser(user, currentlyBlocked) {
      const endpoint = currentlyBlocked ? `/api/unblock/${user}` : `/api/block/${user}`;
      const confirmMsg = currentlyBlocked
        ? `Unblock "${user}"? They will be able to send you messages again.`
        : `Block "${user}"? Their messages will no longer reach you.`;

      if (!confirm(confirmMsg)) return;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (res.ok) {
          if (currentlyBlocked) {
            blockedList = blockedList.filter(u => u !== user);
          } else {
            blockedList.push(user);
            if (selectedUser === user) closeChat();
          }
          renderUserList();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteChatHistory(user) {
      const ok = confirm(`Delete chat history with "${user}"? This cannot be undone.`);
      if (!ok) return;

      try {
        const res = await fetch(`/api/messages/${user}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });

        if (!res.ok) { alert('Failed to delete chat history.'); return; }

        if (selectedUser === user) closeChat();

        unreadCounts[user] = 0;
        await loadContacts();
        renderUserList();
        updateCallButtonsAvailability();
        updateChatHeaderStatus();
      } catch (e) {
        console.error(e);
        alert('Failed to delete chat history.');
      }
    }

    // --- Select direct user ---
    async function selectUser(user) {
      clearMessages();
      selectedUser = user;
      selectedGroupId = null;
      if (!contactsList.includes(user)) contactsList.push(user);

      unreadCounts[user] = 0;
      renderUserList();
      updateCallButtonsAvailability();
      updateChatHeaderStatus();

      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('mobile-hidden');
        document.getElementById('chat-area').classList.add('mobile-fullscreen');
      }

      document.getElementById('no-chat-selected').classList.add('hidden');
      document.getElementById('active-chat-interface').classList.remove('hidden');
      document.getElementById('chat-with-name').innerText = user;

      socket.emit('mark-read', { sender: user });

      const res = await fetch(`/api/messages/${user}`, {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
      });

      const msgs = await res.json();
      msgs.forEach(m => appendMessage(m, m.from === currentUser ? 'sent' : 'received'));
    }

    // --- Select group ---
    async function selectGroup(groupId) {
      clearMessages();
      selectedGroupId = groupId;
      selectedUser = null;

      const grp = groupsList.find(g => g.id === groupId);
      if (!grp) return;
      grp._unread = 0;

      renderGroupList();
      updateCallButtonsAvailability();
      updateChatHeaderStatus();

      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('mobile-hidden');
        document.getElementById('chat-area').classList.add('mobile-fullscreen');
      }

      document.getElementById('no-chat-selected').classList.add('hidden');
      document.getElementById('active-chat-interface').classList.remove('hidden');
      document.getElementById('chat-with-name').innerText = grp.name;

      try {
        const res = await fetch(`/api/groups/${groupId}/messages`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const msgs = await res.json();
        msgs.forEach(m => appendGroupMessage(m));
      } catch (e) {
        console.error('Failed to load group messages', e);
      }
    }

    function closeChat() {
      clearMessages();
      selectedUser = null;
      selectedGroupId = null;

      document.getElementById('active-chat-interface').classList.add('hidden');
      document.getElementById('no-chat-selected').classList.remove('hidden');
      document.getElementById('sidebar').classList.remove('mobile-hidden');
      document.getElementById('chat-area').classList.remove('mobile-fullscreen');

      updateCallButtonsAvailability();
    }

    function updateAttachmentLabel() {
      const file = document.getElementById('attachment-input').files[0];
      document.getElementById('attachment-status').textContent = file ? file.name : '';
      document.getElementById('attachment-remove').hidden = !file;
    }

    function clearSelectedAttachment() {
      document.getElementById('attachment-input').value = '';
      updateAttachmentLabel();
    }

    function clearAttachmentObjectUrls() {
      if (!document.getElementById('image-viewer').classList.contains('hidden')) {
        closeImageViewer();
      }
      for (const url of attachmentObjectUrls) URL.revokeObjectURL(url);
      attachmentObjectUrls.clear();
    }

    function clearMessages() {
      clearAttachmentObjectUrls();
      document.getElementById('messages-container').textContent = '';
      document.getElementById('attachment-input').value = '';
      updateAttachmentLabel();
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      const fileInput = document.getElementById('attachment-input');
      const file = fileInput.files[0];
      if (!text && !file) return;

      if (file) {
        const isImage = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'].includes(file.type);
        const isVideo = ['video/mp4', 'video/webm'].includes(file.type);
        if (!isImage && !isVideo) {
          alert('Choose a JPEG, PNG, GIF, or WebP image, or an MP4 or WebM video.');
          return;
        }
        const maxBytes = isVideo ? 5 * 1024 * 1024 : 1024 * 1024;
        if (file.size >= maxBytes) {
          alert(isVideo ? 'Choose a video smaller than 5 MB.' : 'Choose an image smaller than 1 MB.');
          return;
        }
        if (!selectedUser && !selectedGroupId) return;

        const sendButton = document.querySelector('.input-area button:last-child');
        sendButton.disabled = true;
        try {
          const endpoint = selectedGroupId
            ? `/api/attachments/group/${encodeURIComponent(selectedGroupId)}`
            : `/api/attachments/direct/${encodeURIComponent(selectedUser)}`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + localStorage.getItem('token'),
              'Content-Type': file.type,
              'X-Message-Text': text,
            },
            body: file,
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Attachment upload failed');
          input.value = '';
          fileInput.value = '';
          updateAttachmentLabel();
          if (!selectedGroupId && !contactsList.includes(selectedUser)) {
            contactsList.push(selectedUser);
            renderUserList();
          }
        } catch (error) {
          alert(error.message || 'Attachment upload failed. Please try again.');
        } finally {
          sendButton.disabled = false;
        }
        return;
      }

      if (selectedGroupId) {
        socket.emit('send-group-message', { groupId: selectedGroupId, message: text });
        // Do NOT render here — the server echoes receive-group-message back to the sender too
      } else if (selectedUser) {
        if (!contactsList.includes(selectedUser)) contactsList.push(selectedUser);
        socket.emit('send-message', { to: selectedUser, message: text });
        renderUserList();
      } else {
        return;
      }

      input.value = '';
    }

    function appendMessage(msg, type) {
      const div = document.createElement('div');
      div.className = `message msg-${type}`;
      const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (msg.attachment) appendAttachment(msg, div);
      if (msg.message) {
        const text = document.createElement('div');
        text.style.whiteSpace = 'pre-wrap';
        text.textContent = msg.message;
        div.appendChild(text);
      }

      if (type === 'sent') {
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.append(document.createTextNode(time));
        const tick = document.createElement('span');
        tick.className = 'tick-mark';
        tick.style.marginLeft = '5px';
        tick.textContent = msg.read ? '✓✓' : '✓';
        meta.appendChild(tick);
        div.appendChild(meta);
      } else {
        appendMessageMeta(div, time);
      }

      const container = document.getElementById('messages-container');
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function appendGroupMessage(msg) {
      const isMine = msg.from === currentUser;
      const div = document.createElement('div');
      div.className = `message msg-${isMine ? 'sent' : 'received'}`;
      const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (!isMine) {
        const sender = document.createElement('div');
        sender.className = 'msg-sender-name';
        sender.textContent = msg.from;
        div.appendChild(sender);
      }
      if (msg.attachment) appendAttachment(msg, div);
      if (msg.message) {
        const text = document.createElement('div');
        text.style.whiteSpace = 'pre-wrap';
        text.textContent = msg.message;
        div.appendChild(text);
      }
      appendMessageMeta(div, time);

      const container = document.getElementById('messages-container');
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function appendMessageMeta(parent, time) {
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = time;
      parent.appendChild(meta);
    }

    function openAttachmentViewer(media, trigger = media) {
      imageViewerTrigger = trigger;
      const viewer = document.getElementById('image-viewer');
      const image = document.getElementById('image-viewer-image');
      const video = document.getElementById('image-viewer-video');
      if (media.tagName === 'VIDEO') {
        image.hidden = true;
        video.hidden = false;
        video.src = media.src;
      } else {
        video.pause();
        video.removeAttribute('src');
        video.load();
        video.hidden = true;
        image.hidden = false;
        image.src = media.src;
      }
      viewer.classList.remove('hidden');
      viewer.querySelector('button').focus();
    }

    function closeImageViewer() {
      const viewer = document.getElementById('image-viewer');
      if (viewer.classList.contains('hidden')) return;
      viewer.classList.add('hidden');
      const image = document.getElementById('image-viewer-image');
      const video = document.getElementById('image-viewer-video');
      image.removeAttribute('src');
      image.hidden = false;
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.hidden = true;
      if (imageViewerTrigger && imageViewerTrigger.isConnected) imageViewerTrigger.focus();
      imageViewerTrigger = null;
    }

    async function appendAttachment(msg, parent) {
      const attachmentContainer = document.createElement('div');
      attachmentContainer.textContent = 'Loading attachment…';
      parent.appendChild(attachmentContainer);

      try {
        const response = await fetch(`/api/attachments/${encodeURIComponent(msg.attachment.id)}`, {
          headers: { Authorization: 'Bearer ' + localStorage.getItem('token') },
        });
        if (!response.ok) throw new Error('Attachment unavailable');
        const objectUrl = URL.createObjectURL(await response.blob());
        if (!attachmentContainer.isConnected) {
          URL.revokeObjectURL(objectUrl);
          return;
        }
        attachmentObjectUrls.add(objectUrl);
        if (msg.attachment.mimeType.startsWith('video/')) {
          const video = document.createElement('video');
          video.className = 'message-video';
          video.controls = true;
          video.preload = 'metadata';
          video.playsInline = true;
          video.src = objectUrl;
          video.setAttribute('aria-label', 'Chat video attachment');

          const expandButton = document.createElement('button');
          expandButton.className = 'video-expand';
          expandButton.type = 'button';
          expandButton.textContent = '⛶ Enlarge video';
          expandButton.setAttribute('aria-label', 'Open video at a larger size');
          expandButton.addEventListener('click', () => openAttachmentViewer(video, expandButton));
          attachmentContainer.replaceChildren(video, expandButton);
        } else {
          const image = document.createElement('img');
          image.className = 'message-image';
          image.alt = 'Chat attachment';
          image.loading = 'lazy';
          image.tabIndex = 0;
          image.setAttribute('role', 'button');
          image.setAttribute('aria-label', 'Open image at full size');
          image.addEventListener('click', () => openAttachmentViewer(image));
          image.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openAttachmentViewer(image);
            }
          });
          image.src = objectUrl;
          attachmentContainer.replaceChildren(image);
        }
      } catch (error) {
        attachmentContainer.textContent = '[Attachment unavailable]';
      }
    }

    // --- Create Group Modal ---
    function openCreateGroupModal() {
      const allUsers = Array.from(new Set([...(contactsList || []), ...(onlineUsersList || [])])).filter(u => u !== currentUser);
      const listEl = document.getElementById('modal-members-list');
      listEl.innerHTML = '';

      if (allUsers.length === 0) {
        listEl.innerHTML = '<p style="padding:10px; color:#999; font-size:13px;">No contacts available.</p>';
      } else {
        allUsers.sort().forEach(u => {
          const item = document.createElement('label');
          item.className = 'modal-member-item';
          item.innerHTML = `<input type="checkbox" value="${u}" /> ${u}`;
          listEl.appendChild(item);
        });
      }

      document.getElementById('group-name-input').value = '';
      document.getElementById('create-group-modal').classList.remove('hidden');
    }

    function closeCreateGroupModal() {
      document.getElementById('create-group-modal').classList.add('hidden');
    }

    async function createGroup() {
      const name = document.getElementById('group-name-input').value.trim();
      if (!name) { alert('Please enter a group name.'); return; }

      const checked = Array.from(document.querySelectorAll('#modal-members-list input[type=checkbox]:checked')).map(c => c.value);
      if (checked.length === 0) { alert('Select at least one member.'); return; }

      try {
        const res = await fetch('/api/groups', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ name, members: checked })
        });

        if (res.ok) {
          const group = await res.json();
          if (!groupsList.find(g => g.id === group.id)) groupsList.push(group);
          renderGroupList();
          closeCreateGroupModal();
          switchTab('groups');
          selectGroup(group.id);
        } else {
          const err = await res.json();
          alert(err.message || 'Failed to create group.');
        }
      } catch (e) {
        console.error(e);
        alert('Failed to create group.');
      }
    }

    async function deleteGroup(groupId, groupName) {
      if (!confirm(`Delete group "${groupName}"? This cannot be undone.`)) return;

      try {
        const res = await fetch(`/api/groups/${groupId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });

        if (res.ok) {
          groupsList = groupsList.filter(g => g.id !== groupId);
          if (selectedGroupId === groupId) closeChat();
          renderGroupList();
        } else {
          alert('Failed to delete group.');
        }
      } catch (e) {
        console.error(e);
        alert('Failed to delete group.');
      }
    }

    function updateEnableButtons() {
      const micBtn = document.getElementById('enable-mic-btn');
      const camBtn = document.getElementById('enable-cam-btn');

      micBtn.classList.remove('on', 'off');
      camBtn.classList.remove('on', 'off');

      micBtn.classList.add(prefMicOn ? 'on' : 'off');
      camBtn.classList.add(prefCamOn ? 'on' : 'off');

      micBtn.textContent = `Enable 🎤`;
      camBtn.textContent = `Enable 📷`;
    }

    async function requestMicPermission() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        s.getTracks().forEach(t => t.stop());
        micPermissionGranted = true;
        return true;
      } catch (e) {
        micPermissionGranted = false;
        alert('Mic permission denied or unavailable.');
        return false;
      }
    }

    async function requestCamPermission() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
        s.getTracks().forEach(t => t.stop());
        camPermissionGranted = true;
        return true;
      } catch (e) {
        camPermissionGranted = false;
        alert('Camera permission denied or unavailable.');
        return false;
      }
    }

    async function togglePrefMic() {
      if (!micPermissionGranted) {
        const ok = await requestMicPermission();
        if (!ok) return;
      }
      prefMicOn = !prefMicOn;
      updateEnableButtons();
    }

    async function togglePrefCam() {
      if (!camPermissionGranted) {
        const ok = await requestCamPermission();
        if (!ok) return;
      }
      prefCamOn = !prefCamOn;
      updateEnableButtons();
    }

    function showCallBannerIfNeeded() {
      const banner = document.getElementById('call-banner');
      const msgs = [];

      if (!prefMicOn) msgs.push('Mic is OFF. Tap 🎤 to enable.');
      if (currentCallType === 'video' && !prefCamOn) msgs.push('Camera is OFF. Tap 📷 to enable.');

      if (msgs.length) {
        banner.textContent = msgs.join(' ');
        banner.classList.add('show');
      } else {
        banner.textContent = '';
        banner.classList.remove('show');
      }
    }

    async function getMedia(type) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: type === 'video' ? { facingMode: currentFacingMode } : false
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (audioTrack) audioTrack.enabled = !!prefMicOn;

        if (type === 'video') {
          const videoTrack = stream.getVideoTracks()[0];
          if (videoTrack) videoTrack.enabled = !!prefCamOn;
        }

        isMuted = !prefMicOn;
        isVideoStopped = (type === 'video') ? !prefCamOn : false;

        return stream;
      } catch (e) {
        alert('Media Error: ' + e.message);
        return null;
      }
    }

    async function startCall(type) {
      if (!selectedUser) return alert("Select a user first");

      if (!isUserOnline(selectedUser)) {
        alert(`${selectedUser} is offline. Calls are allowed only when the user is online.`);
        updateCallButtonsAvailability();
        return;
      }

      currentCallType = type;

      localStream = await getMedia(type);
      if (!localStream) return;

      const audioTrack = localStream.getAudioTracks()[0];
      const videoTrack = localStream.getVideoTracks()[0];

      if (type === 'video' && !videoTrack) {
        alert('No camera available. Make sure camera is not blocked and permissions granted.');
        socket.emit('call-diagnostics', { to: selectedUser, stage: 'preflight', reason: 'no-local-video' });
        return;
      }

      if (!audioTrack) {
        alert('No microphone available. Make sure microphone is not blocked and permissions granted.');
        socket.emit('call-diagnostics', { to: selectedUser, stage: 'preflight', reason: 'no-local-audio' });
        return;
      }

      if (!audioTrack.enabled) {
        try { audioTrack.enabled = true; } catch (err) {}
        if (!audioTrack.enabled) {
          alert('Microphone is muted/unavailable. Allow microphone in browser settings.');
          socket.emit('call-diagnostics', { to: selectedUser, stage: 'preflight', reason: 'audio-disabled' });
          return;
        }
      }

      speakerMode = 'headset';
      setupVideoElements(type);
      createPeerConnection();

      const sendersBefore = peerConnection.getSenders().map(s => s.track && s.track.kind).filter(Boolean);
      localStream.getTracks().forEach(track => { peerConnection.addTrack(track, localStream); });
      const sendersAfter = peerConnection.getSenders().map(s => s.track && s.track.kind).filter(Boolean);
      console.log('senders before/after:', sendersBefore, sendersAfter);

      const hasAudioSender = peerConnection.getSenders().some(s => s.track && s.track.kind === 'audio');
      const hasVideoSender = (type === 'video') ? peerConnection.getSenders().some(s => s.track && s.track.kind === 'video') : true;
      if (!hasAudioSender || !hasVideoSender) {
        console.error('Missing local sender(s)', { hasAudioSender, hasVideoSender });
        socket.emit('call-diagnostics', { to: selectedUser, stage: 'preflight', reason: 'missing-senders', hasAudioSender, hasVideoSender });
        alert('Failed to attach local media to the call. Check permissions and try again.');
        return;
      }

      try {
        console.log('Creating offer...');
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        console.log('Local description set; sending offer (sdp length=%d)', offer.sdp?.length || 0);

        socket.emit('call-user', {
          userToCall: selectedUser,
          offer: { type: peerConnection.localDescription.type, sdp: peerConnection.localDescription.sdp },
          type
        });

        socket.emit('call-diagnostics', {
          to: selectedUser,
          stage: 'offer-sent',
          localSenders: peerConnection.getSenders().map(s => s.track && s.track.kind).filter(Boolean),
          sdpLength: peerConnection.localDescription.sdp.length
        });
      } catch (err) {
        console.error('Error creating offer:', err);
        socket.emit('call-diagnostics', { to: selectedUser, stage: 'offer-failed', error: err && err.message });
        alert('Error initiating call: ' + (err && err.message));
        resetCallUI();
        return;
      }

      document.getElementById('call-modal').classList.remove('hidden');
      document.getElementById('call-status-text').innerText = `Calling ${selectedUser}...`;
      document.getElementById('incoming-controls').classList.add('hidden');
      document.getElementById('active-controls').classList.remove('hidden');

      updateControlButtons();
      applySpeakerMode();
      showCallBannerIfNeeded();
    }

    async function answerCall() {
      document.getElementById('ringtone').pause();

      localStream = await getMedia(currentCallType);
      if (!localStream) return;

      speakerMode = 'headset';

      setupVideoElements(currentCallType);
      createPeerConnection();

      try {
        const offerObj = typeof incomingOffer === 'string' ? JSON.parse(incomingOffer) : incomingOffer;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerObj));

        localStream.getTracks().forEach(track => { peerConnection.addTrack(track, localStream); });

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('answer-call', {
          to: selectedUser,
          answer: {
            type: peerConnection.localDescription.type,
            sdp: peerConnection.localDescription.sdp
          }
        });
      } catch (err) {
        console.error('Error answering call:', err);
        alert('Error answering call');
        resetCallUI();
        return;
      }

      document.getElementById('incoming-controls').classList.add('hidden');
      document.getElementById('active-controls').classList.remove('hidden');
      document.getElementById('call-status-text').innerText = "Connected";

      startCallTimer();
      captureAndLogGPS('Start');

      updateControlButtons();
      applySpeakerMode();
      showCallBannerIfNeeded();
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (e) => {
        console.log('ICE candidate:', e.candidate ? `${e.candidate.candidate.substring(0, 50)}...` : 'gathering complete');
        if (e.candidate) {
          socket.emit('ice-candidate', { to: selectedUser, candidate: e.candidate });
        }
      };

      peerConnection.ontrack = (e) => {
        console.log('Remote track received:', e.track.kind, 'streams:', e.streams.length);
        if (currentCallType === 'video') {
          document.getElementById('remote-video').srcObject = e.streams[0];
        } else {
          document.getElementById('remote-audio').srcObject = e.streams[0];
        }
        applySpeakerMode();
      };

      peerConnection.onconnectionstatechange = () => {
        console.log('Connection state:', peerConnection.connectionState);
        if (peerConnection.connectionState === 'failed') console.error('Connection failed!');
      };

      peerConnection.oniceconnectionstatechange = () => {
        console.log('ICE connection state:', peerConnection.iceConnectionState);
      };

      peerConnection.onsignalingstatechange = () => {
        console.log('Signaling state:', peerConnection.signalingState);
      };
    }

    function endCall() {
      captureAndLogGPS('End');
      const status = document.getElementById('call-status-text').innerText;
      if (status.includes("Calling")) socket.emit('cancel-call', { to: selectedUser });
      else socket.emit('end-call', { to: selectedUser });
      resetCallUI();
    }

    function rejectCall() {
      socket.emit('reject-call', { to: selectedUser });
      resetCallUI();
    }

    function resetCallUI() {
      document.getElementById('ringtone').pause();
      document.getElementById('ringtone').currentTime = 0;

      document.getElementById('call-modal').classList.add('hidden');

      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      stopCallTimer();

      document.getElementById('remote-video').srcObject = null;
      document.getElementById('local-video').srcObject = null;
      document.getElementById('remote-audio').srcObject = null;

      isMuted = false;
      isVideoStopped = false;
      speakerMode = 'headset';

      applySpeakerMode();
      updateControlButtons();

      const banner = document.getElementById('call-banner');
      banner.textContent = '';
      banner.classList.remove('show');
    }

    function setupVideoElements(type) {
      if (type === 'video') {
        document.getElementById('video-wrapper').classList.remove('hidden');
        document.getElementById('local-video').srcObject = localStream;
        document.getElementById('cam-off-btn').classList.remove('hidden');
        document.getElementById('switch-cam-btn').classList.remove('hidden');
      } else {
        document.getElementById('video-wrapper').classList.add('hidden');
        document.getElementById('cam-off-btn').classList.add('hidden');
        document.getElementById('switch-cam-btn').classList.add('hidden');
      }
    }

    function toggleMute() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (!audioTrack) return;

      isMuted = !isMuted;
      audioTrack.enabled = !isMuted;

      updateControlButtons();
      showCallBannerIfNeeded();
    }

    function toggleVideo() {
      if (!localStream || currentCallType !== 'video') return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (!videoTrack) return;

      isVideoStopped = !isVideoStopped;
      videoTrack.enabled = !isVideoStopped;

      updateControlButtons();
      showCallBannerIfNeeded();
    }

    function toggleSpeaker() {
      if (speakerMode === 'headset') {
        speakerMode = 'loudspeaker';
      } else if (speakerMode === 'loudspeaker') {
        speakerMode = 'mute';
      } else {
        speakerMode = 'headset';
      }
      applySpeakerMode();
      updateControlButtons();
    }

    function applySpeakerMode() {
      const remoteAudio = document.getElementById('remote-audio');
      const remoteVideo = document.getElementById('remote-video');
      const ringtone = document.getElementById('ringtone');

      if (ringtone && !ringtone.paused) {
        ringtone.muted = false;
        ringtone.volume = 1;
      }

      const isMutedMode = speakerMode === 'mute';

      remoteAudio.muted = isMutedMode;
      remoteAudio.volume = isMutedMode ? 0 : 1;
      remoteVideo.muted = isMutedMode;
      remoteVideo.volume = isMutedMode ? 0 : 1;
    }

    async function switchCamera() {
      if (currentCallType !== 'video' || !localStream || !peerConnection) return;

      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";

      const oldVideoTrack = localStream.getVideoTracks()[0];
      if (oldVideoTrack) oldVideoTrack.stop();

      const newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode },
        audio: true
      });

      const newTrack = newStream.getVideoTracks()[0];
      if (!newTrack) return;

      newTrack.enabled = !isVideoStopped;

      const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(newTrack);

      if (oldVideoTrack) localStream.removeTrack(oldVideoTrack);
      localStream.addTrack(newTrack);

      document.getElementById('local-video').srcObject = localStream;
    }

    function emitLocalDiagnostics(obj) {
      console.log('LOCAL DIAGNOSTIC:', obj);
      if (socket && socket.connected && selectedUser) {
        socket.emit('call-diagnostics', Object.assign({ to: selectedUser }, obj));
      }
    }

    function setButtonVisual(btn, disabled) {
      btn.classList.toggle('active', !!disabled);
    }

    function updateControlButtons() {
      const muteBtn = document.getElementById('mute-btn');
      const camBtn = document.getElementById('cam-off-btn');
      const speakerBtn = document.getElementById('speaker-btn');

      setButtonVisual(muteBtn, isMuted);

      speakerBtn.classList.remove('active');
      speakerBtn.classList.add('btn-secondary');

      if (speakerMode === 'headset') {
        speakerBtn.innerHTML = '<span class="icon">🎧</span>';
      } else if (speakerMode === 'loudspeaker') {
        speakerBtn.innerHTML = '<span class="icon">📢</span>';
      } else if (speakerMode === 'mute') {
        speakerBtn.classList.add('active');
        speakerBtn.innerHTML = '<span class="icon">🔊</span><span class="strike"></span>';
      }

      if (currentCallType === 'video') setButtonVisual(camBtn, isVideoStopped);
    }

    function startCallTimer() {
      let seconds = 0;
      const timerEl = document.getElementById('call-timer');
      callTimerInterval = setInterval(() => {
        seconds++;
        timerEl.innerText =
          `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
      }, 1000);
    }

    function stopCallTimer() {
      clearInterval(callTimerInterval);
      document.getElementById('call-timer').innerText = "00:00";
    }

    function captureAndLogGPS(stage) {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const coords = { latitude: position.coords.latitude, longitude: position.coords.longitude };
            socket.emit('log-gps', { coords, type: currentCallType, stage });
          },
          (error) => {
            console.error("GPS Error:", error);
            socket.emit('log-gps', { coords: { error: error.message }, type: currentCallType, stage });
            if (!window.isSecureContext) alert("GPS Warning: App not running on HTTPS. Mobile browsers block GPS on HTTP.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    function togglePassword(inputId, btnId) {
      const inp = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!inp || !btn) return;
      const isPwd = inp.type === 'password';
      inp.type = isPwd ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(isPwd));
      btn.title = isPwd ? 'Hide password' : 'Show password';
      btn.textContent = isPwd ? '🙈' : '👁️';
      try { inp.focus(); } catch (e) {}
    }
  </script>
